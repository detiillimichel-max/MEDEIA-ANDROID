name: MEDEIA - Drive catalog

on:
  pull_request:
    paths:
      - "engine/**"
      - "tests/**"
      - "data/drive-search/**"
      - ".github/workflows/drive-search.yml"
  workflow_dispatch:
    inputs:
      query:
        description: "Busca opcional por título no Google Drive"
        required: false
        default: ""
        type: string
      limit:
        description: "Quantidade máxima de resultados SearXNG (1 a 20)"
        required: false
        default: "10"
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Offline Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build-catalog:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build catalog
        env:
          SEARXNG_BASE_URL: ${{ vars.SEARXNG_BASE_URL }}
          MEDEIA_QUERY: ${{ inputs.query }}
          MEDEIA_LIMIT: ${{ inputs.limit }}
        run: |
          python -m engine.build_drive_catalog \
            --query "$MEDEIA_QUERY" \
            --limit "$MEDEIA_LIMIT"
      - name: Publish catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drive-search/catalog.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "Build MEDEIA Google Drive catalog"
            git push
          fi
