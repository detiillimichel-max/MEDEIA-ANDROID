name: MEDEIA - SearXNG experimental discovery

on:
  pull_request:
    paths:
      - "engine/**"
      - "tests/**"
      - "data/drive-search/**"
      - ".github/workflows/drive-search.yml"
  workflow_dispatch:
    inputs:
      query:
        description: "Termo para pesquisar em site:drive.google.com"
        required: true
        default: "documentários"
        type: string
      limit:
        description: "Limite experimental por execução (máximo 10)"
        required: true
        default: "10"
        type: choice
        options:
          - "5"
          - "10"

permissions:
  contents: write

concurrency:
  group: medeia-searxng-experimental-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Offline safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  experimental-search:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run experimental SearXNG search
        env:
          SEARXNG_BASE_URL: ${{ vars.SEARXNG_BASE_URL }}
          MEDEIA_QUERY: ${{ inputs.query }}
          MEDEIA_LIMIT: ${{ inputs.limit }}
        run: |
          python -m engine.build_searxng_candidates \
            --query "$MEDEIA_QUERY" \
            --limit "$MEDEIA_LIMIT"
      - name: Save cumulative candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drive-search/discovered-candidates.json
          if git diff --cached --quiet; then
            echo "No candidate changes."
          else
            git commit -m "Update experimental SearXNG candidates"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
